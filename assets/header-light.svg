<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
<defs><linearGradient id="g0" x1="0" x2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/></linearGradient><linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#84cc16"/></linearGradient><linearGradient id="g3" x1="0" x2="1"><stop offset="0" stop-color="#ea580c"/><stop offset="1" stop-color="#e11d48"/></linearGradient><linearGradient id="g4" x1="0" x2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient><linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="930" y2="0"><stop offset="0.00" stop-color="#2563eb"/><stop offset="0.33" stop-color="#7c3aed"/><stop offset="0.67" stop-color="#059669"/><stop offset="1.00" stop-color="#ea580c"/></linearGradient><clipPath id="win"><rect x="0" y="0" width="760" height="86"/></clipPath><clipPath id="card"><rect width="1000" height="320" rx="20"/></clipPath>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif}
.big{font-size:70px;font-weight:800;letter-spacing:-2.5px}
.lead{font-size:70px;font-weight:800;letter-spacing:-2.5px}
.eye{font-size:15px;font-weight:600;letter-spacing:4px}
.sm{font-size:13px;font-weight:600}
.wheel{animation:wheel 13.2s cubic-bezier(.83,0,.17,1) infinite}
@keyframes wheel{0.00%,19.70%{transform:translateY(0px)}25.00%,44.70%{transform:translateY(-78px)}50.00%,69.70%{transform:translateY(-156px)}75.00%,94.70%{transform:translateY(-234px)}100%{transform:translateY(-312px)}}
.rule{}
@keyframes draw{to{stroke-dashoffset:0}}
.in{}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.b1{animation:f1 14s ease-in-out infinite}.b2{animation:f2 17s ease-in-out infinite}.b3{animation:f3 12s ease-in-out infinite}
@keyframes f1{50%{transform:translate(-60px,30px)}}@keyframes f2{50%{transform:translate(50px,-25px)}}@keyframes f3{50%{transform:translate(-30px,-30px)}}
.chip{}
.chip:nth-of-type(1){animation-delay:1.00s}.chip:nth-of-type(2){animation-delay:1.08s}.chip:nth-of-type(3){animation-delay:1.16s}.chip:nth-of-type(4){animation-delay:1.24s}.chip:nth-of-type(5){animation-delay:1.32s}.chip:nth-of-type(6){animation-delay:1.40s}
.blink{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@keyframes d0{0%,0.00%{transform:scaleX(.35);opacity:.35}2.00%,23.00%{transform:scaleX(1);opacity:1}25.01%,100%{transform:scaleX(.35);opacity:.35}}.d0{transform-box:fill-box;transform-origin:left center;animation:d0 13.2s infinite}@keyframes d1{0%,24.99%{transform:scaleX(.35);opacity:.35}27.00%,48.00%{transform:scaleX(1);opacity:1}50.01%,100%{transform:scaleX(.35);opacity:.35}}.d1{transform-box:fill-box;transform-origin:left center;animation:d1 13.2s infinite}@keyframes d2{0%,49.99%{transform:scaleX(.35);opacity:.35}52.00%,73.00%{transform:scaleX(1);opacity:1}75.01%,100%{transform:scaleX(.35);opacity:.35}}.d2{transform-box:fill-box;transform-origin:left center;animation:d2 13.2s infinite}@keyframes d3{0%,74.99%{transform:scaleX(.35);opacity:.35}77.00%,98.00%{transform:scaleX(1);opacity:1}100.00%,100%{transform:scaleX(.35);opacity:.35}}.d3{transform-box:fill-box;transform-origin:left center;animation:d3 13.2s infinite}
</style>
<g clip-path="url(#card)">
<rect width="1000" height="320" fill="#ffffff"/>
<g filter="url(#soft)" opacity=".14">
<circle class="b1" cx="860" cy="70" r="120" fill="#7c3aed"/><circle class="b2" cx="700" cy="250" r="110" fill="#06b6d4"/><circle class="b3" cx="960" cy="260" r="90" fill="#ec4899"/></g>
<rect x="1" y="1" width="998" height="318" rx="19" fill="none" stroke="#e2e8f0" stroke-width="2"/>
<g class="in" style="animation-delay:.1s"><circle cx="72" cy="56" r="5" fill="#22c55e" class="blink"/><text x="86" y="61" class="eye" fill="#64748b">JYOTI PRAKASH PARIDA</text>
<text x="930" y="61" text-anchor="end" class="eye" fill="#64748b">BENGALURU · INDIA</text></g>
<line class="rule" x1="70" y1="84" x2="930" y2="84" stroke="url(#rule)" stroke-width="3" stroke-linecap="round"/>
<g class="in" style="animation-delay:.35s"><text x="70" y="186" class="lead" fill="#0f172a">I build</text></g>
<g transform="translate(288,126)" clip-path="url(#win)"><g class="wheel"><text x="0" y="60" class="big" fill="url(#g0)">backends.</text><text x="0" y="138" class="big" fill="url(#g1)">AI systems.</text><text x="0" y="216" class="big" fill="url(#g2)">data pipelines.</text><text x="0" y="294" class="big" fill="url(#g3)">cloud infra.</text><text x="0" y="372" class="big" fill="url(#g4)">backends.</text></g></g>
<rect class="d0" x="70" y="276" width="26" height="6" rx="3" fill="#2563eb"/><rect class="d1" x="104" y="276" width="26" height="6" rx="3" fill="#7c3aed"/><rect class="d2" x="138" y="276" width="26" height="6" rx="3" fill="#059669"/><rect class="d3" x="172" y="276" width="26" height="6" rx="3" fill="#ea580c"/>
<g class="chip"><rect x="335" y="264" width="71" height="30" rx="15" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="350" cy="279" r="4.5" fill="#f89820"/><text x="361" y="284" class="sm" fill="#0f172a">Java</text></g><g class="chip"><rect x="414" y="264" width="132" height="30" rx="15" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="429" cy="279" r="4.5" fill="#6db33f"/><text x="440" y="284" class="sm" fill="#0f172a">Spring Boot</text></g><g class="chip"><rect x="553" y="264" width="80" height="30" rx="15" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="568" cy="279" r="4.5" fill="#a78bfa"/><text x="579" y="284" class="sm" fill="#0f172a">Kafka</text></g><g class="chip"><rect x="641" y="264" width="123" height="30" rx="15" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="656" cy="279" r="4.5" fill="#ec4899"/><text x="667" y="284" class="sm" fill="#0f172a">LLMs · RAG</text></g><g class="chip"><rect x="772" y="264" width="88" height="30" rx="15" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="787" cy="279" r="4.5" fill="#2496ed"/><text x="798" y="284" class="sm" fill="#0f172a">Docker</text></g><g class="chip"><rect x="868" y="264" width="62" height="30" rx="15" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="883" cy="279" r="4.5" fill="#ff9900"/><text x="894" y="284" class="sm" fill="#0f172a">AWS</text></g>
</g></svg>
